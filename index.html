<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра Сапер</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        h1 { margin-bottom: 10px; }
        #board {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(10, 30px);
            gap: 2px;
            background-color: #7b7b7b;
            border: 3px solid #7b7b7b;
        }
        .cell {
            width: 30px;
            height: 30px;
            background-color: #bdbdbd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px; /* Чуть увеличили шрифт для лучшей читаемости */
            cursor: pointer;
            user-select: none;
            border: 2px outset #ffffff;
            box-sizing: border-box;
        }
        .cell.open {
            background-color: #e0e0e0;
            border: 1px solid #7b7b7b;
        }
        .cell.mine {
            background-color: #ff4d4d;
            border: 1px solid #7b7b7b;
        }
        .cell.flag {
            color: #d32f2f;
        }

        /* ДОБАВЛЕНО: Классические цвета для цифр «Сапёра» */
        .num-1 { color: #0000ff; } /* Синий */
        .num-2 { color: #008000; } /* Зеленый */
        .num-3 { color: #ff0000; } /* Красный */
        .num-4 { color: #000080; } /* Темно-синий */
        .num-5 { color: #800000; } /* Бордовый */
        .num-6 { color: #008080; } /* Бирюзовый */
        .num-7 { color: #000000; } /* Черный */
        .num-8 { color: #808080; } /* Серый */

        #restart {
            margin-top: 15px;
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Сапер</h1>
    <div id="board"></div>
    <button id="restart" onclick="startGame()">Новая игра</button>

    <script>
        const size = 10;
        const minesCount = 12;
        let board = [];
        let gameOver = false;

        const boardElement = document.getElementById('board');

        function startGame() {
            boardElement.innerHTML = '';
            board = [];
            gameOver = false;

            // Создаем пустую доску
            for (let r = 0; r < size; r++) {
                let row = [];
                for (let c = 0; c < size; c++) {
                    let cell = {
                        row: r,
                        col: c,
                        mine: false,
                        isOpen: false,
                        isFlagged: false,
                        neighborMines: 0,
                        element: null
                    };
                    
                    const el = document.createElement('div');
                    el.classList.add('cell');
                    
                    el.addEventListener('click', () => clickCell(r, c));
                    el.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        flagCell(r, c);
                    });

                    boardElement.appendChild(el);
                    
                    cell.element = el;
                    row.push(cell);
                }
                board.push(row);
            }

            // Расставляем мины
            let placedMines = 0;
            while (placedMines < minesCount) {
                let mr = Math.floor(Math.random() * size);
                let mc = Math.floor(Math.random() * size);
                if (!board[mr][mc].mine) {
                    board[mr][mc].mine = true;
                    placedMines++;
                }
            }

            // Считаем соседние мины
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (!board[r][c].mine) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                let nr = r + dr;
                                let nc = c + dc;
                                if (nr >= 0 && nr < size && nc >= 0 && nc < size && board[nr][nc].mine) {
                                    count++;
                                }
                            }
                        }
                        board[r][c].neighborMines = count;
                    }
                }
            }
        }

        function clickCell(r, c) {
            if (gameOver) return;
            let cell = board[r][c];
            if (cell.isOpen || cell.isFlagged) return;

            if (cell.mine) {
                cell.element.classList.add('mine');
                cell.element.textContent = '💣';
                alert('Бум! Вы проиграли.');
                gameOver = true;
                revealAll();
                return;
            }

            openCell(r, c);
            checkWin();
        }

        function flagCell(r, c) {
            if (gameOver) return;
            let cell = board[r][c];
            if (cell.isOpen) return;

            cell.isFlagged = !cell.isFlagged;

            if (cell.isFlagged) {
                cell.element.classList.add('flag');
                cell.element.textContent = '🚩';
            } else {
                cell.element.removeProperty ? cell.element.removeAttribute('class') : null; 
                // Чтобы не сломать классы, просто откатываем назад:
                cell.element.classList.remove('flag');
                cell.element.textContent = '';
            }
        }

        function openCell(r, c) {
            let cell = board[r][c];
            if (cell.isOpen || cell.mine || cell.isFlagged) return;

            cell.isOpen = true;
            cell.element.classList.add('open');

            if (cell.neighborMines > 0) {
                cell.element.textContent = cell.neighborMines;
                // ИЗМЕНЕНО: Добавляем класс, соответствующий цифре (например, num-1, num-2)
                cell.element.classList.add(`num-${cell.neighborMines}`);
            } else {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr;
                        let nc = c + dc;
                        if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
                            if (!board[nr][nc].isOpen) {
                                openCell(nr, nc);
                            }
                        }
                    }
                }
            }
        }

        function revealAll() {
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (board[r][c].mine) {
                        board[r][c].element.classList.add('mine');
                        board[r][c].element.textContent = '💣';
                    }
                }
            }
        }

        function checkWin() {
            let win = true;
            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (!board[r][c].mine && !board[r][c].isOpen) {
                        win = false;
                        break;
                    }
                }
            }
            if (win) {
                alert('Поздравляем, вы выиграли!');
                gameOver = true;
                revealAll();
            }
        }

        startGame();
    </script>
</body>
</html>
